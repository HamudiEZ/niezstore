<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="nsFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado con gradiente de marca -->
  <rect width="32" height="32" rx="8" fill="url(#nsFaviconGrad)" />
  
  <!-- Trazo geométrico N en blanco puro -->
  <path
    d="M 8 23 V 9 L 24 23 V 9"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Vértice de acento celeste -->
  <circle cx="24" cy="9" r="1.8" fill="#38bdf8" />
</svg>
